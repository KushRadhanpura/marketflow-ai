services:
  # Database Service
  - type: database
    name: marketflow-db
    databaseName: marketflow
    user: marketflow
    plan: free

  # FastAPI Backend Service
  - type: web
    name: marketflow-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketflow-db
          property: connectionString
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: LLM_API_KEY
        sync: false # User can provide this via Render dashboard
      - key: LLM_MODEL
        value: gpt-4o-mini

  # Next.js Frontend Service
  - type: web
    name: marketflow-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    rootDir: frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://marketflow-backend.onrender.com/api # Replace with actual backend service URL
      - key: INTERNAL_API_URL
        value: http://marketflow-backend:8000/api # Fallback if internal routing is available on Render private network
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
